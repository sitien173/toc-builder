name: Markdeep canary

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  canary:
    name: Remote Markdeep compatibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run remote canary
        run: npm run test:markdeep-canary
